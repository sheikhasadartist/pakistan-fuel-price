name: Update Fuel Prices

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update fuel.json
        run: |
          cat > fuel.json <<EOF
          {
            "petrol": "Rs. 272.15",
            "diesel": "Rs. 284.35",
            "last_updated": "$(date +'%Y-%m-%d')"
          }
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add fuel.json
          git diff --cached --quiet || git commit -m "Update fuel prices"
          git push
